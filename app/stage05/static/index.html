<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Merseyside Real Ale Pubs</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<header>
  <div>
    <h1>Merseyside Real Ale Pubs</h1>
    <p>Best pubs from CAMRA's Good Beer Guide</p>
  </div>
  <div class="filters">
    <label>Min rating <input type="range" id="minRating"> <output id="minRatingOut"></output></label>
    <label>Min real ales <input type="range" id="minAles"> <output id="minAlesOut"></output></label>
    <span id="count"></span>
  </div>
</header>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
